<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Web shorts runner</title>
<style>
  @font-face { font-family: "Luckiest Guy"; src: url("../assets/fonts/LuckiestGuy-Regular.ttf"); }
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url("node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2"); }
  @font-face { font-family: "Alfa Slab One"; src: url("../assets/fonts/AlfaSlabOne-Regular.woff2"); }
  @font-face { font-family: "Playfair Display"; font-weight: 700; src: url("../assets/fonts/PlayfairDisplay-Bold.woff2"); }
  html, body { margin: 0; background: #111; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }

<body>
<script type="module">
import * as THREE from 'three';
import { createStage } from './lib/world.js';
import { createAntiSnap } from './lib/antisnap.js';

// Frame runner: loads ?clip=<path from studio root>, then window.renderFrame(n) returns a PNG data URL.
// Each frame averages `samples` sub-renders with sub-pixel jitter (anti-aliasing) and, when the clip
// asks for it, spread over the shutter interval (true motion blur). The overlay is drawn once, crisp.
const q = new URLSearchParams(location.search);
const scale = Number(q.get('scale') || 1);
await Promise.all([document.fonts.load('80px "Luckiest Guy"'), document.fonts.load('800 34px Montserrat'), document.fonts.load('80px "Alfa Slab One"'), document.fonts.load('700 40px "Playfair Display"')]);
const clip = await import('../' + q.get('clip'));
const meta = { width: 1080, height: 1920, fps: 30, ...clip.meta };
const stage = createStage({ width: meta.width, height: meta.height, scale, sky: clip.sky || {} });
await clip.setup(stage, THREE);
// The anti-snap filter (lib/antisnap.js), when the clip or its kit turns it on (window.__antiSnap = { on: true }):
// every pose of the clip goes through update(), which eases one-frame snaps inside a shot. Tools use window.clipUpdate.
const AS = globalThis.__antiSnap && globalThis.__antiSnap.on ? createAntiSnap(clip, stage, meta, globalThis.__antiSnap) : null;
const update = AS ? AS.update : (t, st) => clip.update(t, st);
window.clipUpdate = update; window.antiSnap = AS;

const out = document.createElement('canvas'); out.width = stage.W; out.height = stage.H;
const g = out.getContext('2d');
const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };

window.renderFrame = (frame, opts = {}) => {
  const t = (frame - 1) / meta.fps;
  const samples = opts.samples ?? (clip.samples ? clip.samples(t) : 4);
  const shutter = clip.shutter ? clip.shutter(t) : 0;           // fraction of a frame
  for (let i = 0; i < samples; i++) {
    const ts = t + (samples > 1 ? ((i + 0.5) / samples - 0.5) * shutter / meta.fps : 0);
    update(ts, stage);
    if (samples > 1) stage.camera.setViewOffset(stage.W, stage.H, halton(i + 1, 2) - 0.5, halton(i + 1, 3) - 0.5, stage.W, stage.H);
    stage.composer.render();
    stage.camera.clearViewOffset();
    g.globalAlpha = 1 / (i + 1);
    g.drawImage(stage.canvas, 0, 0);
  }
  g.globalAlpha = 1;
  update(t, stage);
  if (clip.overlay) clip.overlay(g, stage.scale, t);
  return out.toDataURL('image/png');
};
// Frame fingerprint without rendering: everything that decides what a frame looks like (camera, every visible mesh's
// world transform, shape and material, lights, fog, bloom, the sample/shutter settings and the 2D overlay drawn small).
// web/changed_frames.mjs compares these with the last render's to find exactly which frames an edit changed.
const ov = document.createElement('canvas'); ov.width = Math.round(meta.width / 4); ov.height = Math.round(meta.height / 4); const og = ov.getContext('2d', { willReadFrequently: true });
const r6 = (x) => Math.round(x * 1e4) / 1e4;
// A texture's identity that is the same on every page load: its name, else its image file's path, else (canvas or
// render target) its size and update count.
// A deformed geometry (e.g. the sheet drape) by its vertex contents, not its version counter (that depends on how often
// the page drew it). Untouched geometry (version 0) counts as fixed.
const posKey = (geo) => { const a = geo?.attributes.position; if (!a || !a.version) return 0; let s1 = 0, s2 = 0; const v = a.array; for (let i = 0; i < v.length; i++) { s1 += v[i]; s2 += v[i] * ((i % 97) + 1); } return r6(s1) + ':' + r6(s2); };
const texKey = (t) => { if (!t) return ''; if (!t.isTexture) return 'x'; if (t.name) return t.name; const im = t.image; if (im?.src) return new URL(im.src).pathname; return (im ? im.width + 'x' + im.height : '') + ':' + t.version; };
const view = new THREE.Frustum(), shade = new THREE.Frustum(), m4 = new THREE.Matrix4(), bs = new THREE.Sphere();
// A 2D context stand-in that draws on the real context and logs each call / property set (gradients and images by value).
const real = new WeakMap();
const fmtArg = (v) => typeof v === 'number' ? r6(v) : v == null ? '' : typeof v === 'string' || typeof v === 'boolean' ? String(v)
  : real.has(v) ? v.__key : v.width !== undefined ? 'img' + v.width + 'x' + v.height + (v.src ? new URL(v.src).pathname : '') : Array.isArray(v) ? v.map(fmtArg).join(',') : 'o';
function recorder(ctx, log) {
  const wrapGrad = (gr, key) => { const p = new Proxy(gr, { get(o, k) { if (k === '__key') return key; const v = o[k]; return typeof v === 'function' ? (...a) => { log.push('g.' + k + '(' + a.map(fmtArg).join(',') + ')'); return v.apply(o, a); } : v; } }); real.set(p, gr); return p; };
  const unwrap = (v) => (real.has(v) ? real.get(v) : v);
  return new Proxy(ctx, {
    get(o, k) {
      const v = o[k];
      if (typeof v !== 'function') return v;
      return (...a) => { const key = k + '(' + a.map(fmtArg).join(',') + ')'; log.push(key); const r = v.apply(o, a.map(unwrap)); return /^create.*Gradient$|^createPattern$/.test(k) ? wrapGrad(r, key) : r; };
    },
    set(o, k, v) { log.push(k + '=' + fmtArg(v)); o[k] = unwrap(v); return true; },
  });
}
window.frameState = (frame, raw = false) => {   // raw: the unhashed state string, for debugging a mismatch
  const t = (frame - 1) / meta.fps, samples = clip.samples ? clip.samples(t) : 4, shutter = clip.shutter ? clip.shutter(t) : 0;
  const parts = [samples, r6(shutter)];
  const ts = samples > 1 ? [t + (0.5 / samples - 0.5) * shutter / meta.fps, t, t + ((samples - 0.5) / samples - 0.5) * shutter / meta.fps] : [t];
  for (const tt of ts) {
    update(tt, stage);
    stage.scene.updateMatrixWorld(true); stage.camera.updateMatrixWorld(true);
    // Run the scene's before-render hooks without drawing: sets apply state there (walls that auto-hide for the camera,
    // light levels), so without this the fingerprint saw the state left by the previous draw (or none on a fresh page).
    stage.scene.onBeforeRender(stage.renderer, stage.scene, stage.camera, null);
    stage.sun.shadow.updateMatrices(stage.sun);   // place the shadow camera now: three.js only does it while rendering, so without this the
                                                  // fingerprint depended on whether (and what) the page had rendered before
    parts.push('C', ...stage.camera.matrixWorld.elements.map(r6), r6(stage.camera.fov));
    // Only what can change the picture: things inside the camera's view, or inside the sun's shadow box if they cast
    // shadows (an object far off-screen, like a prop in another set, doesn't count).
    const sc = stage.sun.shadow.camera; sc.updateMatrixWorld(true);
    view.setFromProjectionMatrix(m4.multiplyMatrices(stage.camera.projectionMatrix, stage.camera.matrixWorldInverse));
    shade.setFromProjectionMatrix(m4.multiplyMatrices(sc.projectionMatrix, sc.matrixWorldInverse));
    stage.scene.traverseVisible((o) => {
      if (o.isLight) {
        parts.push('L', r6(o.intensity), o.color.getHexString(), o.groundColor ? o.groundColor.getHexString() : '', r6(o.angle ?? 0), r6(o.penumbra ?? 0), r6(o.distance ?? 0), ...o.matrixWorld.elements.map(r6));
        if (o.target) parts.push(...o.target.matrixWorld.elements.map(r6));
        return;
      }
      if (!(o.isMesh || o.isSprite || o.isPoints || o.isLine)) return;
      const geo = o.geometry; if (geo && !geo.boundingSphere) geo.computeBoundingSphere();
      // geometry deformed at runtime (e.g. the sheet drape) keeps the bounding sphere of whatever pose it had when the
      // sphere was first computed, so it is always counted and hashed by its contents, never by that sphere
      const deformed = !!geo?.attributes.position?.version;
      if (!deformed && geo?.boundingSphere && o.frustumCulled !== false) {   // always-drawn things (frustumCulled off) always count
        bs.copy(geo.boundingSphere).applyMatrix4(o.matrixWorld); if (o.isSkinnedMesh) bs.radius = bs.radius * 1.5 + 3;   // posed limbs reach past the bind-pose bounds
        if (!view.intersectsSphere(bs) && !(o.castShadow && shade.intersectsSphere(bs))) return;
      }
      parts.push('M', ...o.matrixWorld.elements.map(r6), geo ? geo.attributes.position?.count : 0, posKey(geo), geo?.boundingSphere && !deformed ? r6(geo.boundingSphere.radius) : 0);
      if (o.isInstancedMesh) parts.push(o.count, o.instanceMatrix.version, o.instanceColor?.version ?? '');
      // texture identity (texKey), not just its size: a face swap (talking / mouth_o) keeps the size but changes the picture
      for (const m of [].concat(o.material || [])) {
        parts.push(m.visible, m.color ? m.color.getHexString() : '', m.emissive ? m.emissive.getHexString() + r6(m.emissiveIntensity) : '', r6(m.opacity ?? 1), texKey(m.map), texKey(m.emissiveMap), texKey(m.alphaMap));
        if (m.uniforms) for (const [k, u] of Object.entries(m.uniforms)) { const v = u.value; parts.push(k, v == null ? '' : typeof v === 'number' ? r6(v) : v.isColor ? v.getHexString() : v.isVector3 || v.isVector2 || v.isVector4 ? v.toArray().map(r6).join(',') : v.isTexture ? texKey(v) : ''); }
      }
      if (o.isSkinnedMesh) for (const b of o.skeleton.bones) parts.push(...b.matrixWorld.elements.map(r6));
    });
    const f = stage.scene.fog; parts.push('F', f ? r6(f.near) + ',' + r6(f.far) + f.color.getHexString() : '', r6(stage.bloom?.strength ?? 0));
    parts.push('E', r6(stage.renderer.toneMappingExposure), r6(stage.scene.environmentIntensity ?? 1), texKey(stage.scene.environment), texKey(stage.scene.background));
  }
  update(t, stage);
  // The overlay counts by what it draws, not by its pixels: every canvas call and property set (numbers rounded) is
  // recorded. Pixels were not stable: small text rasterizes a little differently with the canvas's history.
  const log = []; if (clip.overlay) clip.overlay(recorder(og, log), 0.1, t);
  parts.push('O', ...log);
  let h1 = 0x811c9dc5, h2 = 0x01000193;                            // two FNV-style hashes over the state and the overlay
  const str = parts.join('|');
  if (raw) return str;
  for (let i = 0; i < str.length; i++) { h1 = Math.imul(h1 ^ str.charCodeAt(i), 16777619); h2 = Math.imul(h2 ^ str.charCodeAt(i), 2246822519); }
  return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
};
// Warm-up: the first text a page draws rasterizes slightly differently from every later draw (glyph caches), which made
// the first frame each page fingerprinted differ from the same frame fingerprinted later. Draw every font and the clip's
// own overlay once on both canvases before reporting ready.
for (const [cv, ctx, sc] of [[out, g, stage.scale], [ov, og, 0.1]]) {
  for (const f of ['80px "Luckiest Guy"', '800 34px Montserrat', '80px "Alfa Slab One"', '700 40px "Playfair Display"']) { ctx.font = f; ctx.fillText('AaQq09 WARMUP', 10, 60); }
  if (clip.overlay) { update(0, stage); clip.overlay(ctx, sc, 0); clip.overlay(ctx, sc, 0); }
  cv.width = cv.width;
}
window.clipMeta = meta;
window.clipModule = clip; window.clipStage = stage;     // for tools that query a clip (e.g. which frames see an object)
window.ready = true;
</script>
